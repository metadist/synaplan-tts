# Synaplan TTS
#
# Piper HTTP API. The published image already contains four voices
# (English, German, Spanish, Turkish) — first start needs no download.
#
#   Local dev  : docker compose up -d          (binds 127.0.0.1)
#   GPU server : copy .env.example → .env, set TTS_BIND_ADDRESS
#   Extra voices: drop .onnx + .onnx.json into ./voices/ (see README)
#
# Test:
#   curl http://${TTS_BIND_ADDRESS:-127.0.0.1}:10200/health
#   curl "http://${TTS_BIND_ADDRESS:-127.0.0.1}:10200/api/tts?text=Hello&language=en" -o test.wav
#
# Image: ghcr.io/metadist/synaplan-tts:latest
# Source: https://github.com/metadist/synaplan-tts

services:
  piper:
    image: ghcr.io/metadist/synaplan-tts:latest
    build: .
    container_name: synaplan-piper-tts
    restart: unless-stopped
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:10200:10200"
    volumes:
      # Host extras only — do not mount over /voices (that hides the baked set).
      - ./voices:/voices-extra:ro
    environment:
      VOICES_DIR: /voices
      EXTRA_VOICES_DIR: /voices-extra
      DEFAULT_VOICE: en_US-lessac-medium
      MAX_TEXT_LENGTH: "5000"
      SYNTH_WORKERS: "4"
